apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexacloud-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nexacloud-api
  template:
    metadata:
      labels:
        app: nexacloud-api
    spec:
      containers:
        - name: nexacloud-api
          image: nexacloud-api:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
