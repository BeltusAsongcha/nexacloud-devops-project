name: NexaCloud Deploy Pipeline

on:
  push:
    branches: [master]
    paths:
      - "nexacloud-api/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and Validate
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: nexacloud-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate application syntax
        run: node --check app.js

      - name: Validate required Kubernetes files
        run: |
          test -f k8s/deployment.yaml
          test -f k8s/service.yaml
          grep -q 'nexacloud-api:latest' k8s/deployment.yaml

      - name: Build Docker image
        run: docker build --progress=plain -t nexacloud-api:latest .

      - name: Verify Docker image
        run: docker image inspect nexacloud-api:latest --format '{{.RepoTags}}'

  deploy:
    name: Deployment Configuration Verification
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify production database secret configuration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRD }}
        shell: bash
        run: |
          if [[ -z "$DATABASE_URL" ]]; then
            echo "::notice::DATABASE_URL_PRD is not configured. Live deployment is disabled."
          else
            echo "Production database secret is configured."
          fi

          echo "No database connection strings are printed."

      - name: Validate Kubernetes manifests
        run: |
          python3 -m pip install --quiet pyyaml

          python3 - <<'PY'
          import yaml
          from pathlib import Path

          directory = Path("nexacloud-api/k8s")
          for filename in ("deployment.yaml", "service.yaml"):
              path = directory / filename
              with path.open(encoding="utf-8") as stream:
                  manifest = yaml.safe_load(stream)

              assert isinstance(manifest, dict), f"Invalid manifest: {filename}"
              assert manifest.get("kind") in ("Deployment", "Service")
              print(f"Validated {filename}: {manifest['kind']}")

          print("Kubernetes configuration validation passed.")
          PY

      - name: Verify GDPR log sanitisation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/deploy.yml").read_text()

          # Check executable shell logging statements, not strings
          # inside the verification script itself.
          lines = workflow.splitlines()

          unsafe = []
          for line in lines:
              stripped = line.strip()

              if stripped.startswith("echo ") and (
                  "$DATABASE_URL" in stripped
                  or "$SESSION_TOKEN" in stripped
                  or "$CLIENT_IP" in stripped
                  or "$USER_ID" in stripped
              ):
                  unsafe.append("Unsafe sensitive-value logging")

              if stripped in ("printenv", "env", "env | sort", "set -x"):
                  unsafe.append("Unsafe environment logging")

          if unsafe:
              raise SystemExit("GDPR log verification failed")

          print("GDPR static verification passed.")
          print("client_ip: not emitted by workflow")
          print("session_token: not emitted by workflow")
          print("user_id: not emitted by workflow")
          print("DATABASE_URL: value not printed")
          PY
      - name: Deployment verification summary
        run: |
          echo "Build completed successfully."
          echo "Kubernetes manifests validated."
          echo "Sensitive data excluded from workflow output."
          echo "Live Kubernetes deployment not performed."